
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PC Virtual</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#123b68,#10152e);
  height:100vh;
  overflow:hidden;
  color:white;
}
.desktop { height:calc(100vh - 45px); padding:15px; }
.icon {
  width:85px;
  padding:12px 5px;
  text-align:center;
  cursor:pointer;
  border-radius:8px;
  font-size:13px;
}
.icon:hover { background:#ffffff30; }
.icon span { display:block;font-size:35px;margin-bottom:7px; }
.taskbar {
  height:45px;
  position:absolute;
  bottom:0;
  width:100%;
  background:#151515eF;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}
button {
  border:0;
  padding:9px 13px;
  border-radius:6px;
  cursor:pointer;
}
.start { background:#2678d9;color:white;font-size:18px; }
.window {
  position:absolute;
  top:100px;
  left:80px;
  width:330px;
  max-width:90vw;
  background:#eee;
  color:#222;
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 8px 35px #0008;
}
.titlebar {
  background:#1769aa;
  color:white;
  padding:12px;
  cursor:move;
  display:flex;
  justify-content:space-between;
}
.content { padding:15px; }
textarea {
  width:100%;
  height:180px;
  resize:vertical;
}
input { padding:9px;max-width:100%; }
.startmenu {
  display:none;
  position:absolute;
  bottom:45px;
  left:5px;
  width:250px;
  background:#202b40;
  padding:15px;
  border-radius:10px 10px 0 0;
}
.startmenu button {
  display:block;
  width:100%;
  margin:5px 0;
  text-align:left;
  background:#ffffff15;
  color:white;
}
</style>
</head>
<body>

<div class="desktop">
  <div class="icon" onclick="openApp('notas')">
    <span>📝</span>Bloco de notas
  </div>
  <div class="icon" onclick="openApp('calc')">
    <span>🧮</span>Calculadora
  </div>
  <div class="icon" onclick="openApp('browser')">
    <span>🌐</span>Navegador
  </div>
  <div class="icon" onclick="openApp('files')">
    <span>📁</span>Arquivos
  </div>
  <div class="icon" onclick="openApp('about')">
    <span>💻</span>Meu computador
  </div>
</div>

<div id="windows"></div>

<div class="startmenu" id="startmenu">
  <h3>🖥️ Meu PC</h3>
  <button onclick="openApp('notas')">📝 Bloco de notas</button>
  <button onclick="openApp('calc')">🧮 Calculadora</button>
  <button onclick="openApp('browser')">🌐 Navegador</button>
  <button onclick="openApp('files')">📁 Arquivos</button>
  <button onclick="openApp('about')">⚙️ Sobre o PC</button>
</div>

<div class="taskbar">
  <button class="start" onclick="toggleStart()">⊞</button>
  <span>🖥️ Meu PC Virtual</span>
  <span id="clock"></span>
</div>

<script>
let z = 10;

function toggleStart() {
  let menu = document.getElementById('startmenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function openApp(app) {
  document.getElementById('startmenu').style.display='none';

  let titles = {
    notas:'Bloco de notas',
    calc:'Calculadora',
    browser:'Navegador',
    files:'Arquivos',
    about:'Meu computador'
  };

  let contents = {
    notas:`<textarea id="note" placeholder="Digite suas anotações..."></textarea>`,
    calc:`<input id="display" placeholder="0" readonly style="width:100%;font-size:22px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px">
    ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'].map(v=>`<button onclick="press('${v}')">${v}</button>`).join('')}
    </div>`,
    browser:`<h3>🌐 Navegador</h3>
    <input id="url" placeholder="Digite um endereço..." style="width:100%">
    <button onclick="navigate()">Acessar</button>
    <p id="result">Bem-vindo ao navegador!</p>`,
    files:`<h3>📁 Meus arquivos</h3>
    <p>📄 Documento.txt</p>
    <p>🖼️ Imagens</p>
    <p>📁 Downloads</p>
    <p>📁 Documentos</p>`,
    about:`<h2>🖥️ Meu PC Virtual</h2>
    <p>Sistema: Virtual OS</p>
    <p>Versão: 1.0</p>
    <p>Desenvolvido em HTML, CSS e JavaScript.</p>`
  };

  let win = document.createElement('div');
  win.className='window';
  win.style.left=(40+Math.random()*100)+'px';
  win.style.top=(50+Math.random()*100)+'px';
  win.style.zIndex=++z;

  win.innerHTML=`
    <div class="titlebar">
      <span>${titles[app]}</span>
      <button onclick="this.closest('.window').remove()">✕</button>
    </div>
    <div class="content">${contents[app]}</div>
  `;

  document.getElementById('windows').appendChild(win);
  makeDraggable(win);
}

function makeDraggable(win) {
  let bar=win.querySelector('.titlebar');
  let x=0,y=0,drag=false;

  bar.addEventListener('pointerdown',e=>{
    if(e.target.tagName==='BUTTON') return;
    drag=true;
    x=e.clientX-win.offsetLeft;
    y=e.clientY-win.offsetTop;
    win.style.zIndex=++z;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener('pointermove',e=>{
    if(!drag)return;
    win.style.left=(e.clientX-x)+'px';
    win.style.top=(e.clientY-y)+'px';
  });

  bar.addEventListener('pointerup',()=>drag=false);
}

function press(v) {
  let d=document.getElementById('display');
  if(!d)return;

  if(v==='C') d.value='';
  else if(v==='=') {
    try {
      if(!/^[0-9+\-*/. ()]+$/.test(d.value)) throw Error();
      d.value=Function('"use strict";return ('+d.value+')')();
    } catch { d.value='Erro'; }
  }
  else d.value+=v;
}

function navigate() {
  let url=document.getElementById('url').value.trim();
  if(!url)return;
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  window.open(url,'_blank');
  document.getElementById('result').textContent='Página aberta em uma nova aba.';
}

function updateClock() {
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);
updateClock();
</script>
</body>
</html>
